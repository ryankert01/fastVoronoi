coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto

comment:
  layout: "header, diff, flags, files"
  behavior: default

flags:
  cpp:
    paths:
      - src/
      - include/
  python:
    paths:
      - tests/

ignore:
  - "pybind11"
  - "build"
  - "tests/cpp"
  - "examples"
